name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Exercise Windows process handling and Tk with the native runtime.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
          architecture: x64
          cache: pip
          cache-dependency-path: 'requirements/*.lock'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies and build the native SQLite runtime
        run: |
          python -m pip install --upgrade pip==26.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements/dev.lock -r requirements/semantic.lock -r requirements/native-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements/web.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.build_sqlite_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements/pilot.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from app.sqlite_runtime import sqlite3; import tkinter; print('SQLite', sqlite3.sqlite_version, 'Tk', tkinter.TkVersion)"
      - name: Check lint and types
        run: |
          python -m ruff check app scripts tools tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy app scripts tools/run_checks.py tools/windows_checks.py tests/_checks_plugin.py
      - name: Audit installed Windows distributions using isolated audit tools
        shell: pwsh
        run: |
          python -m venv build/audit-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & './build/audit-tools/Scripts/python.exe' -m pip install -r requirements/audit.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build/checks/security -ErrorAction Stop | Out-Null
          python -m scripts.audit_runtime_dependencies --auditor-python build/audit-tools/Scripts/python.exe --output-dir build/checks/security
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose mapped and withdrawn startup in fresh native processes
        continue-on-error: true # Diagnostic evidence only; the full suite remains mandatory.
        run: python -m tools.profile_gui_startup --output build/checks/startup-profile.json
      - name: Upload startup profiles before the full suite
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-profile-windows-server-2025
          path: |
            build/checks/startup-profile.json
            build/checks/startup-profile-workers/
          if-no-files-found: warn
          retention-days: 14
      - name: Run all tests with native Tk and isolated process trees
        run: |
          python -m tools.run_checks --mode all --fail-on-skip `
            --exclude-test tests/test_runtime_backup.py::test_importing_local_fifo_is_rejected_without_blocking "POSIX mkfifo has no Windows equivalent" `
            --exclude-test tests/test_runtime_jobs.py::test_checkpoint_replaced_by_fifo_cannot_block_result_or_shutdown "POSIX mkfifo has no Windows equivalent" `
            --exclude-test tests/test_pilot_service_integration.py::test_local_result_fifo_is_rejected_without_blocking_ui_executor "POSIX mkfifo has no Windows equivalent" `
            --exclude-test tests/test_pilot_profiles.py::test_directory_sync_failure_after_commit_keeps_new_selection_with_warning "Directory fsync is POSIX-specific" `
            --exclude-test tests/test_pilot_profiles.py::test_restore_postcommit_sync_failure_returns_new_backend_and_explicit_warning "Directory fsync is POSIX-specific" `
            --exclude-test tests/backend/test_repository.py::test_new_database_is_private "Windows uses profile ACLs rather than POSIX file modes" `
            --exclude-test tests/test_backend_lock_safety.py::test_lock_closes_existing_permissive_profile_and_file "Windows uses profile ACLs rather than POSIX file modes" `
            --exclude-test tests/test_pilot_sources.py::test_archive_revisions_are_private_even_in_an_existing_permissive_directory "Windows uses profile ACLs rather than POSIX file modes" `
            --exclude-test tests/test_runtime_backup.py::test_package_is_private_while_compression_is_writing "Windows uses profile ACLs rather than POSIX file modes" `
            --exclude-test tests/test_runtime_jobs.py::test_analysis_database_and_checkpoints_are_private_on_disk "Windows uses profile ACLs rather than POSIX file modes"
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-reports-windows-server-2025
          path: |
            build/checks/
          if-no-files-found: warn
          retention-days: 14
