name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: 'requirements/*.lock'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Tk display and font libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth openbox wmctrl libtk8.6 libfontconfig1
      - name: Install locked application and check dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements/dev.lock -r requirements/semantic.lock -r requirements/native-build.lock
          python -m pip install -r requirements/web.txt
          python -m scripts.build_sqlite_runtime
          python -m pip install -r requirements/pilot.lock
          python -m pip check
          python -c 'import tkinter; print("Tk", tkinter.TkVersion)'
      - name: Check lint and types
        run: |
          python -m ruff check app scripts tools tests
          python -m mypy app scripts tools/run_checks.py tests/_checks_plugin.py
      - name: Audit installed distributions using isolated audit tools
        run: |
          python -m venv build/audit-tools
          build/audit-tools/bin/python -m pip install -r requirements/audit.lock
          mkdir -p build/checks/security
          python -m scripts.audit_runtime_dependencies --auditor-python build/audit-tools/bin/python --output-dir build/checks/security
      - name: Run complete suite with isolated GUI cases
        run: bash scripts/check_linux.sh
      - name: Gate mapped document resize in five fresh GUI processes
        run: >-
          bash scripts/check_linux.sh --resize-performance --samples 5
          --wall-budget 2 --cpu-budget 1 --lag-budget 1
          --output build/checks/resize-performance.json
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-reports-linux
          path: |
            build/checks/
          if-no-files-found: warn
          retention-days: 14
