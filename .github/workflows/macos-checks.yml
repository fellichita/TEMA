name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Exercise the application with a native Apple Silicon runtime.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.15'
          architecture: arm64
          cache: pip
          cache-dependency-path: 'requirements/*.lock'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked application and check dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements/dev.lock -r requirements/semantic.lock -r requirements/native-build.lock
          python -m pip install -r requirements/web.txt
          python -m scripts.build_sqlite_runtime
          python -m pip install -r requirements/pilot.lock
          python -m pip check
          python -c 'import tkinter; print("Tk", tkinter.TkVersion)'
      - name: Check lint and types
        run: |
          python -m ruff check app scripts tools tests
          python -m mypy app scripts tools/run_checks.py tests/_checks_plugin.py
      - name: Run complete native test suite
        run: >-
          python -m tools.run_checks --mode all --fail-on-skip
          --exclude-test tests/test_run_web_demo.py::test_windows_children_keep_system_root_whatever_its_spelling
          "Windows environment variable check is inapplicable on macOS"
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-reports-macos-arm64
          path: |
            build/checks/
          if-no-files-found: warn
          retention-days: 14
